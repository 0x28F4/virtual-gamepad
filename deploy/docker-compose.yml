services:
  virtual-gamepad:
    image: ghcr.io/0x28f4/virtual-gamepad:latest
    container_name: virtual-gamepad
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/uinput:/dev/uinput
    ports:
      - "8788:8788"
    environment:
      ROOM_TOKEN: "${ROOM_TOKEN:-dev}"
      INPUT_DRIVER: "${INPUT_DRIVER:-fake}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
