services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${PUBLIC_HOST:-}"
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935" # RTMP ingest from OBS or FFmpeg
      - "8554:8554" # RTSP playback
      - "8888:8888" # LL-HLS playback
      - "8889:8889" # WebRTC HTTP signaling and player
      - "8189:8189/udp" # WebRTC media over UDP
      - "8189:8189/tcp" # WebRTC media over TCP fallback

  virtual-gamepad:
    image: ghcr.io/0x28f4/virtual-gamepad:latest
    container_name: virtual-gamepad
    restart: unless-stopped
    stdin_open: true
    tty: true
    devices:
      - /dev/uinput:/dev/uinput
    ports:
      - "${CONTROLLER_BIND:-127.0.0.1}:8788:8788"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      TERM: "xterm-256color"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./configs/config:/app/public/config:ro
    depends_on:
      - mediamtx

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: virtual-gamepad-tunnel
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - virtual-gamepad
